name: krishimarket
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.0.0
  provider: ^6.1.5+1
  http: ^1.6.0
  speech_to_text: ^7.4.0
  permission_handler: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/splash.png

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/splash.png
  fullscreen: true

  android_12:
    color: "#FFFFFF"
    image: assets/splash.png